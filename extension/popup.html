<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ATS Resume Analyzer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            width: 340px;
            padding: 20px;
            background: linear-gradient(135deg, #0052D4, #4364F7, #6FB1FC);
            color: white;
        }

        .card {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 22px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .logo {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: rgba(255,255,255,0.9);
            line-height: 1.5;
            margin-bottom: 22px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: white;
            color: #0052D4;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            transform: translateY(-3px);
            background: #EDF4FF;
            box-shadow: 0 12px 25px rgba(0,0,0,.25);
        }

        .footer {
            margin-top: 16px;
            font-size: 12px;
            color: rgba(255,255,255,.75);
        }
    </style>

</head>

<body>

<div class="card">

    <div class="logo">📄</div>

    <h1>ATS Resume Analyzer</h1>

    <p>
        Analyze your resume, compare it with any job description,
        improve your ATS score and get AI-powered suggestions.
    </p>

    <button id="openApp">
        🚀 Launch Analyzer
    </button>

    <div class="footer">
        Version 1.0
    </div>

</div>

<script src="popup.js"></script>

</body>
</html>
